# cargo-about の設定。scripts/gen-licenses.sh が licenses/THIRD-PARTY.md を作るときに使う。
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
# 配布する 3 つ（Windows の fude.exe、macOS の fude、WSL に置く fude-linux）の依存を合わせる。
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# 自分のクレート（publish = false）と spikes は一覧に載せない。
private = { ignore = true }
