[package]
name = "fude-fs"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ignore = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fude-core = { path = "../fude-core" }
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.13.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
trash = "5.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
