[package]
name = "fude-shell-menu"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows 11 のエクスプローラーの右クリックメニュー「fude で開く」（IExplorerCommand の DLL）"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_LibraryLoader"] }
windows-core = "0.62"
