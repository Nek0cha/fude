[package]
name = "fude"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = { version = "0.9.1", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-sql", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-ruby", "tree-sitter-php"] }
fude-core = { path = "../fude-core" }
fude-term = { path = "../fude-term" }
futures = "0.3"
notify = "8"
fude-ipc = { path = "../fude-ipc" }
fude-fs = { path = "../fude-fs" }
serde_json = "1"
# 新しい版の問い合わせ（10g）。TLS は OS のもの（Windows は SChannel、mac は Security.framework）と OS の証明書を使い、rustls と同梱の証明書は入れない。
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
raw-window-handle = "0.6"
# 画像の頭だけ読んで幅と高さを求める（GPUI が既に使っている版。形式の機能は GPUI 側で有効になる）。
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSBundle", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# Windows の exe にアイコンと版の情報を埋め込む（build.rs。Windows のターゲットのときだけ使う）。
winresource = "0.1.34"
